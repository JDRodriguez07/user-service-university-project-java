services:
  # ------------------------- MySQL -------------------------
  user_db:
    build:
      context: ./MySQL # Usa el Dockerfile de la carpeta MySQL
      dockerfile: Dockerfile
    container_name: mysql_user_service
    restart: always
    ports:
      - "1121:3306" # host:container
    volumes:
      - ./config/mysql:/var/lib/mysql
    hostname: user_db # nombre dentro de la red Docker
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in .env}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    networks:
      - red_microservicios
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # ------------------------- Adminer -----------------------
  adminer:
    image: adminer
    container_name: adminer_user_service
    restart: always
    ports:
      - "1122:8080" # http://localhost:1122
    networks:
      - red_microservicios

  # ---------------------- user-service ---------------------
  user_service:
    build:
      context: ./user-service # Usa el Dockerfile del microservicio
      dockerfile: Dockerfile
    container_name: backend_user_service
    restart: always
    ports:
      - "1123:8080" # host:container
    depends_on:
      user_db:
        condition: service_healthy
    environment:
      # OJO: estos son los que lee tu application.properties
      DB_HOST: user_db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

      # Reutilizamos lo que ya tienes en .env para JWT
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:?Set JWT_EXPIRATION_MS in .env}

      # Optional one-time bootstrap administrator. Disabled by default.
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    networks:
      - red_microservicios

networks:
  red_microservicios:
    external: true
